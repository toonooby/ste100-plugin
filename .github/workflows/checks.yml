name: Hook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: |
          command -v jq >/dev/null || brew install jq
          command -v shellcheck >/dev/null || brew install shellcheck
      - name: Check Bash syntax and lint
        run: |
          bash -n scripts/ste-inject.sh
          bash -n scripts/ste-level.sh
          shellcheck scripts/ste-inject.sh scripts/ste-level.sh
      - name: Run hook regression tests
        run: python3 -m unittest discover -s tests -v
